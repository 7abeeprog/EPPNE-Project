version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: eppne_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eppne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eppne}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c 'max_connections=500' -c 'shared_buffers=2GB'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eppne_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  minio:
    image: minio/minio
    container_name: eppne_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: eppne_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: eppne_grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  worker:
    build: .
    container_name: eppne_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-eppne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eppne}
    restart: unless-stopped

  flower:
    image: mher/flower
    container_name: eppne_flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    command: celery -A app.core.celery_app flower --broker=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  grafana_data:
