version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: eppne_db
    environment:
      POSTGRES_USER: eppne
      POSTGRES_PASSWORD: eppne123
      POSTGRES_DB: eppne
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c 'max_connections=500' -c 'shared_buffers=2GB'

  redis:
    image: redis:7-alpine
    container_name: eppne_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  minio:
    image: minio/minio
    container_name: eppne_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus
    container_name: eppne_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: eppne_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

  worker:
    build: .
    container_name: eppne_worker
    # 🔥 نعتمد على redis كخدمة معرفة بالأعلى
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://eppne:eppne123@postgres:5432/eppne

  flower:
    image: mher/flower
    container_name: eppne_flower
    ports:
      - "5555:5555"
    command: celery -A app.core.celery_app flower --broker=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  minio_data:
  grafana_data:
