version: '3.9'

# ============================================================
# شبكة داخلية معزولة (للاتصال بين الخدمات فقط)
# ============================================================
networks:
  eppne_network:
    driver: bridge
    name: eppne_network

# ============================================================
# وحدات التخزين الدائمة (Volumes)
# ============================================================
volumes:
  postgres_data:
    name: eppne_postgres_data
  minio_data:
    name: eppne_minio_data
  grafana_data:
    name: eppne_grafana_data

# ============================================================
# الخدمات
# ============================================================
services:
  # ==========================================================
  # 1. PostgreSQL (قاعدة البيانات الأساسية)
  # ==========================================================
  postgres:
    image: postgres:16
    container_name: eppne_db
    environment:
      # ✅ تم حذف POSTGRES_USER ليستخدم الافتراضي "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eppne123}
      POSTGRES_DB: ${POSTGRES_DB:-eppne_v2}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres  -c 'max_connections=500'  -c 'shared_buffers=2GB'  -c 'log_min_duration_statement=1000'
    restart: unless-stopped
    networks:
      - eppne_network
    healthcheck:
      # ✅ تم تعديل healthcheck ليستخدم المستخدم "postgres"
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-eppne_v2}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # ==========================================================
  # 2. Redis (ذاكرة تخزين مؤقتة و Broker للمهام)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: eppne_redis
    command: >
      redis-server  --appendonly yes  --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --maxclients 1000
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    networks:
      - eppne_network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ==========================================================
  # 3. MinIO (تخزين الملفات S3)
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: eppne_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - eppne_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ==========================================================
  # 4. Prometheus (جمع المقاييس)
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: eppne_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    restart: unless-stopped
    networks:
      - eppne_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ==========================================================
  # 5. Grafana (لوحات المراقبة)
  # ==========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: eppne_grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - eppne_network
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ==========================================================
  # 6. Backend (التطبيق الرئيسي FastAPI)
  # ==========================================================
  backend:
    build: .
    container_name: eppne_backend
    image: eppne-backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # ✅ تم تعديل DATABASE_URL ليستخدم eppne:eppne123 (مع منفذ 5435)
      - DATABASE_URL=postgresql+asyncpg://eppne:eppne123@postgres:5432/eppne_v2
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-admin@eppne.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - eppne_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ==========================================================
  # 7. Celery Worker (معالج المهام غير المتزامنة)
  # ==========================================================
  worker:
    build: .
    container_name: eppne_worker
    image: eppne-worker:latest
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=100
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # ✅ تم تعديل DATABASE_URL ليستخدم eppne:eppne123 (مع منفذ 5435)
      - DATABASE_URL=postgresql+asyncpg://eppne:eppne123@postgres:5432/eppne_v2
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP=true
      - CELERY_BROKER_CONNECTION_RETRY=true
      - CELERY_BROKER_CONNECTION_RETRY_INTERVAL=1
      - CELERY_BROKER_CONNECTION_RETRY_INTERVAL_MAX=60
    restart: unless-stopped
    networks:
      - eppne_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ==========================================================
  # 8. Flower (مراقبة Celery)
  # ==========================================================
  flower:
    image: mher/flower:latest
    container_name: eppne_flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    command: >
      celery -A app.core.celery_app flower  --broker=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - eppne_network
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
