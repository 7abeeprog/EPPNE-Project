# .ai-generated/k8s/base/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eppne-backend-hpa
  namespace: eppne
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eppne-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
