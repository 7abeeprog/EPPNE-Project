apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: eppne
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# 🔥 السماح للـ Backend بالاتصال بـ RDS (PostgreSQL)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-rds
  namespace: eppne
spec:
  podSelector:
    matchLabels:
      app: eppne-backend
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        # 🔥 يجب استبدال هذا بـ CIDR الخاص بـ RDS في بيئتك
        cidr: 10.0.0.0/16
    ports:
    - protocol: TCP
      port: 5432
---
# 🔥 السماح للـ Backend بالاتصال بـ Redis (ElastiCache)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-redis
  namespace: eppne
spec:
  podSelector:
    matchLabels:
      app: eppne-backend
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        # 🔥 يجب استبدال هذا بـ CIDR الخاص بـ ElastiCache
        cidr: 10.0.1.0/24
    ports:
    - protocol: TCP
      port: 6379
---
# 🔥 السماح للـ Web بالاتصال بـ Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-backend
  namespace: eppne
spec:
  podSelector:
    matchLabels:
      app: eppne-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: eppne-web
    ports:
    - protocol: TCP
      port: 8000
---
# 🔥 السماح للـ Backend بالاتصال بـ AWS Secrets Manager (لـ External Secrets)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-aws-secrets
  namespace: eppne
spec:
  podSelector:
    matchLabels:
      app: eppne-backend
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443