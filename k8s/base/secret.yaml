# ============================================================
# 🔥 ⚠️ تحذير أمني شديد الأهمية ⚠️
# ============================================================
# هذا الملف يُستخدم فقط للاختبار المحلي (local development) أو كـ fallback.
# في بيئة الإنتاج، يجب حذف هذا الملف واستخدام External Secrets
# (انظر external-secret.yaml) مع AWS Secrets Manager.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: eppne-secrets
  namespace: eppne
type: Opaque
stringData:
  # 🔥 غيّر هذه القيم فوراً! استخدم AWS Secrets Manager في الإنتاج.
  SECRET_KEY: "CHANGE_ME_NOW_MIN_32_CHARS_12345678901234567890"
  FIRST_SUPERUSER_EMAIL: "admin@eppne.com"
  FIRST_SUPERUSER_PASSWORD: "CHANGE_ME_NOW_STRONG_PASSWORD"
  DATABASE_URL: "postgresql+asyncpg://eppne:CHANGE_ME@rds-host:5432/eppne"
  REDIS_URL: "redis://:CHANGE_ME@redis-host:6379/0"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_ACCESS_KEY: "CHANGE_ME_AWS_ACCESS_KEY"
  S3_SECRET_KEY: "CHANGE_ME_AWS_SECRET_KEY"